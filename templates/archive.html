<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191C22" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Archive · Daily Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234B6B9A'/%3E%3Cpath d='M9 9h6.5a5 5 0 0 1 5 5v9H14a5 5 0 0 1-5-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{BASE}}assets/app.css?v={{V}}">
</head>
<body data-page="archive">
<header class="topbar">
  <a class="brand" href="{{BASE}}index.html">Daily Reader</a>
  <a class="topbar-link" href="{{BASE}}index.html">Today</a>
</header>

<main class="container">
  <h1 class="page-title">Archive</h1>

  <div class="filters">
    <input type="search" id="q" class="search" placeholder="Search titles and sources" autocomplete="off" aria-label="Search titles and sources">
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
    <label class="toggle"><input type="checkbox" id="unread"> Unread only</label>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
  <noscript><p class="notices">The archive needs JavaScript.</p></noscript>
</main>

<script id="archive-config" type="application/json">{{CONFIG_JSON}}</script>
<script type="module" src="{{BASE}}assets/app.js?v={{V}}"></script>
</body>
</html>
